name: Actualizar datos INDEC

on:
  schedule:
    # De lunes a viernes a las 17:30 de Argentina: INDEC publica a las 16:00.
    - cron: '30 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Descargar datos
        shell: pwsh
        env:
          INDEC_TOKEN: ${{ secrets.INDEC_TOKEN }}
        run: ./scripts/actualizar.ps1
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/datos.json data/datos.js
          if git diff --cached --quiet ; then
            echo "Sin cambios"
          else
            git commit -m "Datos INDEC $(date -u +%F)"
            git push
          fi
